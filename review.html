<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence review · Hades</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f6;--text:#232723;--muted:#555e59;--border:#cdd1cb;--console:#15201c;--output:#edf1e9;--accent:#abdbb6}
@media(prefers-color-scheme:dark){:root{--bg:#171b19;--text:#e7ece7;--muted:#acb9ae;--border:#46524a;--console:#0e1512}}
*{box-sizing:border-box}body{margin:0 auto;padding:24px 18px 40px;max-width:940px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
header,footer,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.035em;margin:22px 0 0}p{margin:5px 0 16px;color:var(--muted)}a{color:inherit}
button,textarea{font:inherit;color:inherit}button{border:1px solid var(--border);border-radius:6px;background:transparent;padding:6px 14px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}button[type=submit]{background:var(--text);color:var(--bg)}
#terminal{background:var(--console);color:var(--output);padding:18px 20px;border-radius:8px;height:clamp(220px,48vh,560px);overflow:auto;font:15px/1.6 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.turn + .turn{margin-top:20px}.voice{color:var(--accent);font-weight:650}.reply,.question,pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.question{margin-bottom:10px}details{margin-top:8px;color:#bac6bf;font-size:.84rem}summary{cursor:pointer;width:fit-content}details pre{margin-top:8px}
textarea{display:block;width:100%;resize:vertical;min-height:50px;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);margin:6px 0 8px}
form{margin-top:18px}footer{color:var(--muted);font-size:.9rem}#status{margin:0}button:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #579a79;outline-offset:2px}
</style>
</head>
<body>
<header><a id="back">← Live loop</a><span id="project"></span></header>
<h1>Evidence review with Claude</h1>
<p>Ask about this project's saved experiment outcomes. Claude reads a snapshot when you send your first question.</p>
<div id="terminal" tabindex="0" aria-label="Evidence review transcript"><span id="empty">Ready for your first question.</span></div>
<form id="composer"><label for="question">Your question</label>
<textarea id="question" rows="2" maxlength="4000" placeholder="What do the saved records actually show?" required></textarea>
<footer><span id="status" role="status">Ready</span><div class="controls"><button type="button" id="end" hidden>End review</button><button type="submit" id="send">Send</button></div></footer></form>
<script>
const $ = id => document.getElementById(id);
const project = new URLSearchParams(location.search).get("project") || "";
$("project").textContent = project;
$("back").href = "/#/" + encodeURIComponent(project) + "/loop";
const terminal = $("terminal"), input = $("question"), form = $("composer");
let session, busy = false, queued = "", ended = false;
const headers = {"Content-Type":"application/json", "X-Hades-Review":"1"};
function controls() {
  $("send").textContent = ended ? "Start new review" : busy ? "Queue follow-up" : "Send";
  $("send").disabled = !ended && (!!queued || !input.value.trim());
  $("end").hidden = !session || ended;
  input.required = !ended;
}
function node(parent, tag, value, className) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  el.textContent = value;
  parent.append(el);
  return el;
}
function endRemote(id) {
  if (id) fetch("/api/review/end", {method:"POST", headers, body:JSON.stringify({project, session:id}), keepalive:true}).catch(() => {});
}
function endReview(message) {
  const id = session;
  session = null;
  busy = false;
  ended = true;
  if (queued) input.value = queued + (input.value ? "\n" + input.value : "");
  queued = "";
  $("status").textContent = message;
  controls();
  endRemote(id);
}
function reset() {
  terminal.replaceChildren();
  node(terminal, "span", "Ready for your first question.").id = "empty";
  ended = false;
  $("status").textContent = "Ready";
  controls();
  input.focus();
}
async function ask(question) {
  const start = !session;
  const id = session ||= crypto.randomUUID().replaceAll("-", "");
  busy = true;
  controls();
  $("empty")?.remove();
  const turn = node(terminal, "section", "", "turn");
  node(turn, "div", "You", "voice"); node(turn, "div", question, "question");
  node(turn, "div", "Claude", "voice");
  const reply = node(turn, "div", "", "reply");
  const text = reply.appendChild(document.createTextNode(""));
  $("status").textContent = start ? "Starting Claude…" : "Waiting for Claude…";
  terminal.scrollTop = terminal.scrollHeight;
  try {
    const response = await fetch("/api/review/ask", {method:"POST", headers,
      body: JSON.stringify({project, session:id, question, start})});
    if (!response.ok) throw Error((await response.json()).error || "Could not open the review.");
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let pending = "", complete = false;
    while (true) {
      const {value, done} = await reader.read();
      if (session !== id) { await reader.cancel(); return; }
      if (done) break;
      pending += decoder.decode(value, {stream:true});
      const lines = pending.split("\n");
      pending = lines.pop();
      for (const line of lines) {
        const packet = JSON.parse(line);
        const follow = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 12;
        if (packet.type === "input") {
          const details = node(turn, "details", "");
          turn.insertBefore(details, reply);
          node(details, "summary", "ⓘ Command and prompt");
          node(details, "pre", "Argument list\n" + JSON.stringify(packet.argv, null, 2) +
               "\n\nMessage sent to Claude\n" + JSON.stringify(packet.message, null, 2));
        }
        if (packet.type === "text") {
          text.appendData(packet.text);
          if (!queued) $("status").textContent = "Claude is answering…";
        }
        if (packet.type === "error") throw Error(packet.text);
        if (packet.type === "done") complete = true;
        if (follow) terminal.scrollTop = terminal.scrollHeight;
      }
    }
    if (!complete) throw Error("The connection closed before the answer finished.");
    busy = false;
    $("status").textContent = "Ready for a follow-up";
    controls();
    if (queued) { const next = queued; queued = ""; await ask(next); }
  } catch (error) {
    if (session === id) endReview(error.message);
  }
}
form.onsubmit = event => {
  event.preventDefault();
  if (ended) { reset(); return; }
  const q = input.value.trim();
  if (!q || queued) return;
  input.value = "";
  if (busy) {
    queued = q;
    $("status").textContent = "Follow-up queued for the end of this answer";
    controls();
  } else ask(q);
  input.focus();
};
input.oninput = controls;
input.onkeydown = event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {event.preventDefault(); form.requestSubmit();}
};
$("end").onclick = () => endReview("Review ended");
addEventListener("pagehide", () => { if (session) endReview("Review ended"); });
controls();
if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)) {
  input.disabled = true;
  $("status").textContent = "Open this page on the dashboard host using localhost to start a review.";
}
</script>
</body>
</html>
