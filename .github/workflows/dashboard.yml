name: Dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    strategy:
      fail-fast: false  # one platform failing must not hide the other's result
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/check_dashboard.py
      - run: python tests/check_research.py
        if: ${{ !cancelled() }}  # report both files in one run
