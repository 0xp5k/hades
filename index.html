}

function liveLoop(p, d) {
  const { rounds, lastStop } = d.loop;
  const running = (p.launched || []).filter(x => x.alive).map(x => x.agent);
  const compose = startBar(p);
  const idle = `<p><b>${lastStop ? esc(lastStop.text) : rounds.length ? "No worker is running from this page." : "Nothing has run yet."}</b>${lastStop ? ` <span class="sub">${esc(ago(lastStop.ts).toLowerCase())}</span>` : ""}</p>
    ${recipeList(p).length ? "<p class=\"sub\">Start a loop below. Claude's session streams here, and you can message it while it works.</p>" : ""}`;
  const heading = !S.connected ? '<p class="state-line">Disconnected · showing saved events</p>' : p.hold ? `<p class="state-line">${esc(cap(p.hold))}</p>` : "";
  const terminalFor = round => { const launch = terminalLaunch(p, round); return { launch, html: terminalPanel(p, round, launch, { rounds, compose, idle }) }; };
  if (!rounds.length) return heading + terminalFor(null).html;
  const status = r => r.state || (r.hasOutput ? "Output saved" :
    r.open && S.connected && running.includes(r.agent) ? "Running" : "Start reported");
  const visible = rounds.filter(r => hit(r.agent, r.harness, "Iteration " + r.number, status(r)) ||
    r.lines.some(line => hit(line.text)) || r.updates.some(u => hit(u.reason, u.outcome, u.detail, ...u.refs)))
    .sort((a, b) => b.lastEvent - a.lastEvent);
  if (!visible.length) return heading + terminalFor(null).html + bare("No matching iterations.");
  const pin = pinnedRounds.get(p.id);
  const round = visible.find(r => r.key === pin) || visible[0];
  const last = round.lines[round.lines.length - 1];
  const stamp = ts => new Date(ts).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  const figures = r => { const f = roundFigures(r); return f.length ? ` · <span class="loop-figs">${esc(f.join(" · "))}</span>` : ""; };
  const subject = r => (r.hasHandoff && handoffHeadline(r.handoff)) || r.focus?.title || r.updates[r.updates.length - 1]?.title ||
    (r.apiError ? "Harness reported an API error" : r.state === "Failed" ? "Harness exited with an error" :
      r.hasOutput ? "Round output saved" : r.state ? "Ended without a handoff" : r.frame ? `Settling [${r.frame}]` : "Widening");
  const card = r => `<button class="loop-round" data-loop-round="${r.key}" data-fk="round:${r.key}" aria-pressed="${r === round}">
    <span class="row"><strong>${esc(subject(r))}</strong><span class="sub ${r.state === "Failed" ? "t-err" : ""}">${esc(status(r))}</span></span>
    <span class="sub">${esc(r.agent)} · Iteration ${esc(r.number)}${r.frame ? ` · frame ${esc(r.frame)}` : ""} · ${esc(stamp(r.ts))}${figures(r)}</span></button>`;
  // Runs of two or more rounds that recorded nothing new fold into one line. A failed round,
  // the selected round and a round still running always stay visible.
  const quiet = r => {
    if (r === round || r.open || r.state === "Failed" || r.apiError || r.updates.some(u => u.focus)) return false;
    if (!r.hasOutput) return true;
    if (!r.hasHandoff) return false;  // a free-text handoff may say anything
    const { parts } = parseHandoff(r.handoff);
    return parts.length > 0 && parts.every(x => x.label === "Next" || !x.items.length);
  };
  const history = [];
  for (const r of visible) {
    const last = history[history.length - 1];
    if (quiet(r) && last && (last.quiet || last.alone)) { if (last.alone) { history[history.length - 1] = { quiet: [last.alone] }; } history[history.length - 1].quiet.push(r); }
    else history.push(quiet(r) ? { alone: r } : r);
  }
  for (let i = 0; i < history.length; i++) if (history[i].alone) history[i] = history[i].alone;
  const quietRow = list => {
    const key = "quiet:" + p.id + ":" + list[0].key, open = S.open.has(key);
    return `<button class="loop-round loop-quiet" data-open="${esc(key)}" data-fk="open:${esc(key)}" aria-expanded="${open}">
      <span class="sub">${open ? "▾" : "▸"} ${list.length} rounds, nothing new · iterations ${esc(list[list.length - 1].number)}–${esc(list[0].number)}</span></button>${open ? list.map(card).join("") : ""}`;
  };
  const focus = round.focus || round.updates[round.updates.length - 1];
  const source = ref => /^https?:\/\/[^\s]+$/i.test(ref)
    ? `<a href="${esc(ref)}" target="_blank" rel="noopener noreferrer">${esc(ref)}</a>` : esc(ref);
  const facts = u => [
    u.reason && `<dt>Stated reason</dt><dd>${esc(u.reason)}</dd>`,
    u.refs.length && `<dt>Evidence</dt><dd>${u.refs.map(source).join("<br>")}</dd>`,
    u.outcome && `<dt>Reported result</dt><dd>${esc(u.outcome)}</dd>`
  ].filter(Boolean).join("");
  const details = focus && facts(focus);
  const updateRow = u => `<li><time datetime="${esc(u.ts)}">${esc(clock(u.ts))}</time><div><span class="sub">${esc(u.label)}</span>
    <div>${esc(u.title)}</div>${u.detail && u.detail !== u.title ? `<p>${esc(u.detail)}</p>` : ""}
    ${u !== focus && facts(u) ? `<dl class="kv">${facts(u)}</dl>` : ""}</div></li>`;
  const logKey = `loop-log:${p.id}:${round.key}`;
  const { launch, html: terminal } = terminalFor(round);
  const infoInTerminal = launch && launch.session === round.session && (pinnedRounds.has(p.id) || !attachedLogs.has(p.id));
  const info = infoInTerminal ? "" : runInfoButton(p, round.agent, round.session, round.number);
  return heading + terminal + `<article class="loop-work"><header><p class="sub">${esc(round.agent)} · Iteration ${esc(round.number)} · ${esc(status(round))}${figures(round)} ${info}</p>
    <h2>${round.handoff ? (round.apiError ? "Harness error" : round.hasHandoff ? "Round handoff" : "Final output") : focus ? esc(subject(round)) : round.state ? "No handoff was saved" : "Awaiting final output"}</h2></header>
    ${round.handoff ? handoffHTML(round.handoff) : ""}
    ${details ? `<dl class="kv">${details}</dl>` : ""}
    ${!focus && round.apiError ? '<p>The harness returned an error before it published a work update.</p>' : ""}
    <div class="sub">Last report ${esc(clock(last.ts))} · ${esc(ago(last.ts))}</div></article>
    ${round.updates.length ? `<h2 class="mt2">Reported work</h2>${paged("updates:" + round.key, [...round.updates].reverse(), 8, updateRow, html => `<ol class="loop-updates">${html}</ol>`)}` : ""}
    <details class="loop-console" data-keep-details="${esc(logKey)}" ${S.open.has(logKey) ? "open" : ""}><summary>Recorded events</summary>
    <div class="loop-output" tabindex="0" aria-label="Iteration log" data-keep="${esc(JSON.stringify([p.id, round.key]))}" data-tail>
    ${round.lines.map(line => `<div class="loop-line"><time datetime="${esc(line.ts)}">${esc(clock(line.ts))}</time><span>${esc(line.text)}</span></div>`).join("")}</div></details>
    <div class="row mt2"><h2>Iteration history</h2>${pin !== undefined ? '<button class="btn small ghost" data-loop-follow>Follow latest</button>' : '<span class="sub">Following latest</span>'}</div>` +
    paged("loop-history", history, 15, x => x.quiet ? quietRow(x.quiet) : card(x), html => `<div class="result-list">${html}</div>`);
}

const views = {
  overview,
  loop: liveLoop,
  research: researchPanel,
  library(p, d, list) {
    const entries = list.filter(page => page.inLibrary);
    const matches = entries.filter(page => {
      if (hit(page.title)) return true;
      if (page.topic) return hit(page.topic.body);
      return [...(d.items.get(page.section.id)?.values() || [])].some(item => hit(item.key, item.text, item.body));
    }).sort((a, b) => a.title.localeCompare(b.title));
    if (!matches.length) return bare(entries.length ? "No matching pages." : "Ask Claude to explain something about this project. Its page will appear here.");
    return paged("library", matches, 20, page => `<a class="need" href="${href(p.id, page.id)}">${esc(page.title)}</a>`,
      rows => `<div class="box glass">${rows}</div>`);
  },

  topic(t) {
    return `<article class="box glass"><div class="md">${md(t.body)}</div></article>`;
  },

  section(p, d, sec) {
    const all = [...(d.items.get(sec.id) || new Map()).values()], statuses = Array.isArray(sec.statuses) ? sec.statuses : [];
    if (!all.length) return bare(sec.view === "note" ? "No notes yet." : "No entries yet.");
    const match = all.filter(i => hit(i.key, i.text, i.status, i.agent, i.body, typeof i.value === "string" ? i.value : "", ...Object.values(i.data || {}).map(String)));
    const none = bare("No matches"), cell = v => v === undefined || v === null ? "–" : typeof v === "number" ? fmt(v) : String(v);

    if (sec.view === "note") {
      const sorted = [...match].reverse().sort((x, y) => (y.ts || "").localeCompare(x.ts || ""));
      return match.length ? paged("notes:" + sec.id, sorted, 8, i => {
        const text = i.body || i.text || "", key = "note:" + sec.id + ":" + i.key;
        const long = text.length > 420 || text.split("\n").length > 7;
        const open = !long || S.open.has(key);
        const preview = text.split(/\n\s*\n/)[0].slice(0, 420);
        return `<article class="note-entry"><div class="row"><h2>${esc(i.key)}</h2>${i.ts ? `<span class="sub nowrap">${esc(ago(i.ts))}</span>` : ""}</div>
          <div class="md mt">${md(open ? text : preview)}</div>
          ${long ? `<div class="actions"><button class="btn small ghost" data-open="${esc(key)}" data-fk="open:${esc(key)}" aria-expanded="${open}">${open ? "Show less" : "Read more"}</button></div>` : ""}</article>`;
      }, html => `<div class="note-list">${html}</div>`) : none;
    }

    if (sec.view === "table") {
      const cols = Array.isArray(sec.columns) && sec.columns.length ? sec.columns : [...new Set(all.flatMap(i => Object.keys(i.data || {})))];
      const numeric = c => all.every(i => !i.data || i.data[c] === undefined || typeof i.data[c] === "number");
      return `<div class="box glass"><div class="scrollx" data-keep="table:${esc(sec.id)}"><table>
        <tr><th>${esc(sec.title || sec.id)}</th>${cols.map(c => `<th class="${numeric(c) ? "r" : ""}">${esc(c)}</th>`).join("")}${statuses.length ? "<th>Status</th>" : ""}<th class="r">Updated</th></tr>
        ${match.map(i => `<tr><td>${esc(i.key)}</td>${cols.map(c => `<td class="${numeric(c) ? "r" : ""}">${esc(cell((i.data || {})[c]))}</td>`).join("")}
          ${statuses.length ? `<td>${statusPill(i.status, sec)}</td>` : ""}<td class="r sub">${ago(i.ts)}</td></tr>`).join("") || `<tr><td colspan="${cols.length + 3}" class="empty">No matches</td></tr>`}
        </table></div></div>`;
    }

    // A section saved with a view this page no longer draws: its entries as a plain list.
    return match.length ? paged("list:" + sec.id, match, 18, i => `<article class="note-entry"><div class="row"><h2>${esc(i.key)}</h2>${statusPill(i.status, sec)}</div>
      ${i.text ? `<div class="sub">${esc(i.text)}</div>` : ""}${i.body ? `<div class="md mt">${md(i.body)}</div>` : ""}</article>`, html => `<div class="note-list">${html}</div>`) : none;
  },

};

/* ---------- rendering ---------- */
let lastSig = "", lastNav = "", lastProj = "", lastPage = "", lastFocus = "", pendingScroll = "", pressing = false;
addEventListener("pointerdown", () => { pressing = true; }, true);
for (const type of ["pointerup", "pointercancel", "blur"]) addEventListener(type, () => { pressing = false; setTimeout(() => render(false), 0); }, true);
function selecting() {
  const s = getSelection();
  return s && !s.isCollapsed && $("#view").contains(s.anchorNode);
}
function render(force) {
  const { p, list, page, focus } = route(), ev = p ? (S.events[p.id] || []) : [];
  if (focus && focus !== lastFocus) { lastFocus = focus; S.researchTime = "all"; S.open.add("thread:" + focus); pendingScroll = "research-" + focus; }  // a link to one thread
  const sig = JSON.stringify([S.connected, S.loaded, p && p.id, page && page.id, focus, S.q, [...S.open], S.researchTime, S.limit, S.projects.map(x => [x.id, x.config, x.hold, x.launched, x.launchers, x.launcherError]), ev.length, Math.floor(Date.now() / 20000)]);
  // A background refresh must never pull the page out from under the reader: wait while text is selected or a
  // click is in progress (replacing a button between press and release would swallow the click).
  if (!force && (sig === lastSig || selecting() || pressing)) return;
  lastSig = sig;

  $("#conn").hidden = S.connected;
  $("#q").placeholder = page?.id === "library" ? "Search library" : "Search this page";
  $("#q").setAttribute("aria-label", $("#q").placeholder);
  $("#q").hidden = !!page?.topic || page?.id === "overview";
  $("#copy-claude").hidden = !p;
  const ids = JSON.stringify(S.projects.map(x => [x.id, projectTitle(x)])), sel = $("#proj");
  if (ids !== lastProj) { lastProj = ids; sel.innerHTML = S.projects.map(x => `<option value="${esc(x.id)}">${esc(projectTitle(x))}</option>`).join(""); }
  sel.hidden = S.projects.length < 2;
  if (p && sel.value !== p.id) sel.value = p.id;
  $("#project-crumb").hidden = S.projects.length !== 1;
  if (p) {
    $("#project-home").textContent = projectTitle(p);
    $("#project-home").href = href(p.id, "overview");
  }

  const navLink = x => `<a href="${href(p.id, x.id)}" class="${x === page ? "on" : ""}" data-fk="nav:${esc(x.id)}" ${x === page ? 'aria-current="page"' : ""}>${esc(x.title)}</a>`;
  const nav = list.length ? list.filter(x => x.primary).map(navLink).join("") + `<details class="page-menu">
    <summary class="${page?.primary ? "" : "on"}" data-fk="more-pages">More</summary>
    <div class="page-menu-list">${list.filter(x => !x.primary && !x.inLibrary).map(navLink).join("")}<button class="btn small ghost new-project" data-new-project>New project</button></div></details>` : "";
  const active = document.activeElement, fk = active?.dataset.fk;
  const caret = fk && active.matches("textarea, input:not([type])") ? [active.selectionStart, active.selectionEnd] : null;
  if (nav !== lastNav) { lastNav = nav; $("#pages").innerHTML = nav; }

  const keep = {};
  document.querySelectorAll("#view [data-keep]").forEach(el => keep[el.dataset.keep] = [el.scrollTop, el.scrollLeft, el.scrollHeight - el.clientHeight - el.scrollTop < 4]);
  if (!S.loaded) $("#view").innerHTML = S.connected ? `<p class="empty">Loading…</p>` : `<div class="box glass"><h2>Cannot reach the server</h2><div class="sub">Start it with <code>python3 server.py</code>. This page will reconnect by itself.</div></div>`;
  else if (!p) $("#view").innerHTML = `<h1>No projects yet</h1><p class="goal">Start one to say what should be researched.</p><button class="btn small" data-new-project>New project</button>`;
  else {
    const d = derive(p);
    let body;
    if (page.section) body = views.section(p, d, page.section);
    else if (page.topic) body = views.topic(page.topic);
    else body = views[page.id](p, d, list);
    document.title = `${page.title} · ${projectTitle(p)}`;
    $("#view").innerHTML = page.id === "overview" ? body : `<header class="pagehead">${page.inLibrary ? `<a class="sub" href="${href(p.id, "library")}">← Library</a>` : ""}<h1>${esc(page.title)}</h1></header>` + body;
  }
  document.querySelectorAll("#view [data-keep]").forEach(el => { const k = keep[el.dataset.keep]; if (k) { el.scrollTop = k[0]; el.scrollLeft = k[1]; } if (el.hasAttribute("data-tail") && (!k || k[2])) el.scrollTop = el.scrollHeight; });
  const where = (p ? p.id : "") + "/" + (page ? page.id : "");
  if (where !== lastPage) { lastPage = where; $("#main").scrollTop = 0; if (Object.keys(S.limit).length) { S.limit = {}; return render(true); } }
  if (pendingScroll && page?.id === "research") {  // arriving from the Overview, or from a link to one thread
    const target = document.getElementById(pendingScroll);
    pendingScroll = "";
    target?.scrollIntoView({ block: "start" });
  }
  if (fk && document.activeElement === document.body) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) { el.focus({ preventScroll: true }); if (caret && el.matches("textarea, input:not([type])")) el.setSelectionRange(...caret); } }
}
/* ---------- data ---------- */
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
let timer = 0, busy = false, again = false;
async function poll() {
  if (busy) { again = true; return; }
  busy = true; clearTimeout(timer);
  try {
    S.projects = await getJSON("/api/projects");
    const { p } = route();
    if (p) {
      const have = S.events[p.id] || (S.events[p.id] = []);
      if (S.epoch[p.id] !== p.epoch || p.count < have.length) { have.length = 0; S.epoch[p.id] = p.epoch; }  // server restarted: refetch
      while (have.length < p.count) {
        const got = (await getJSON(`/api/events?project=${encodeURIComponent(p.id)}&after=${have.length}`)).events;
        if (!got.length) break;
        have.push(...got);
      }
    }
    S.connected = true; S.loaded = true;
  } catch (e) { S.connected = false; }
  busy = false;
  render(false);
  if (again) { again = false; poll(); } else timer = setTimeout(poll, 2000);
}
async function send(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) {  // the server says why in plain words (a name already taken, a missing field); show that
      const why = await r.json().then(j => j && j.error, () => null);
      toast(why ? "Not saved: " + why : "Could not save that.");
      return false;
    }
    poll();
    return true;
  } catch (e) { toast("Could not save that. Check the server is still running."); return false; }
}
let toastTimer = 0;
function toast(text) {
  $("#toast").textContent = text; $("#toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").hidden = true; }, 4000);
}

async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { window.prompt("Copy this", text); }
}

// One quiet mark on a thread; a second press while it is being saved does nothing.
const marking = new Set();
async function mark(id, change, done) {

document.addEventListener("click", async e => {
  const b = e.target.closest("button");

  else if (b.hasAttribute("data-attach-log")) {

  }

    const paused = b.dataset.pause === "1";

  }
  else if (b.dataset.threadStatus) mark(b.dataset.id, { status: b.dataset.threadStatus }, b.dataset.threadStatus === "superseded" ? "Dropped. Reopen it any time." : "Reopened");
  else if (b.dataset.audit) {

  }

  }
  else if (b.dataset.copyThread) copyThread(b.dataset.copyThread);
  else if (b.dataset.overrule) openOverrule(b.dataset.overrule);
  else if (b.hasAttribute("data-detach-log")) {
    attachedLogs.delete(route().p.id); terminalView = {key:"", text:"", info:""}; render(true);
  }
  else if (b.hasAttribute("data-loop-round") || b.hasAttribute("data-loop-follow")) {
    const { p } = route();
    if (b.hasAttribute("data-loop-follow")) pinnedRounds.delete(p.id);
    else pinnedRounds.set(p.id, Number(b.dataset.loopRound));
    render(true);
  }
  else if (b.dataset.open) { S.open.has(b.dataset.open) ? S.open.delete(b.dataset.open) : S.open.add(b.dataset.open); render(true); }
  else if (b.dataset.researchTarget) {
    S.researchTime = "all"; S.q = ""; $("#q").value = ""; S.open.add("thread:" + b.dataset.researchTarget); for (const k of Object.keys(S.limit)) if (k.startsWith("research:")) S.limit[k] = 100000; render(true);
    document.getElementById("research-" + b.dataset.researchTarget)?.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  else if (b.dataset.researchTime) { S.researchTime = b.dataset.researchTime; render(true); }
  else if (b.dataset.more) { const step = Number(b.dataset.step) || 10; S.limit[b.dataset.more] = (S.limit[b.dataset.more] || step) + step * 2; render(true); }
});

/* ---------- overruling an assumption: the person's answer, which every later round takes as decided ---------- */
let overruling = { project: "", id: "" };
function openOverrule(id) {
  const { p } = route(), x = derive(p).assumptions.find(q => q.id === id);
  if (!x) return;
  overruling = { project: p.id, id };
  $("#ask-text").textContent = x.text;
  $("#ask-form").reset();
  $("#ask").showModal(); $("#ask-answer").focus();
}
$("#ask-cancel").addEventListener("click", () => $("#ask").close());
$("#ask-form").addEventListener("submit", async e => {
  e.preventDefault();
  const answer = $("#ask-answer").value.trim();
  if (!answer) { $("#ask-answer").focus(); return; }
  $("#ask-ok").disabled = true;
  const ok = await send("/api/events", { project: overruling.project, type: "question", id: overruling.id, answer, source: "you" });
  $("#ask-ok").disabled = false;
  if (ok) { $("#ask").close(); toast("Overruled. Later rounds take your answer as decided."); }
});
const store = { get: (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch (e) { return fallback; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- appearance ---------- */
function applyTheme(choice) {
  store.set("pv-theme", choice);
  document.documentElement.dataset.theme = choice === "light" || choice === "dark" ? choice : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (store.get("pv-theme", "dark") === "system") applyTheme("system"); });
$("#brand").insertAdjacentHTML("afterbegin", LOGO);
$("#theme").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

document.addEventListener("click", e => {
  if (!e.target.closest("[data-new-project]")) return;
  $("#np-form").reset(); $("#np").showModal(); $("#np-name").focus();
});
$("#np-cancel").addEventListener("click", () => $("#np").close());
$("#np-form").addEventListener("submit", async e => {
  e.preventDefault();
  const project = $("#np-name").value.trim();
  $("#np-ok").disabled = true;
  const target = $("#np-target").value.trim(), agent_files = $("#np-files").value.trim();
  const ok = await send("/api/new", { project, goal: $("#np-goal").value.trim(), ...(target ? { target } : {}), ...(agent_files ? { agent_files } : {}) });
  $("#np-ok").disabled = false;
  if (ok) { $("#np").close(); location.hash = href(project, "overview"); }
});
refreshTerminal();
setInterval(() => render(false), 5000);  // keeps relative timestamps fresh
poll();
</script>
</body>
</html>
