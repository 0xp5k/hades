<script>
"use strict";
const $ = s => document.querySelector(s);
const S = { projects: [], events: {}, epoch: {}, limit: {}, q: "", open: new Set(), researchTime: "all", connected: true, loaded: false };

/* ---------- small helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const hit = (...parts) => !S.q || parts.filter(Boolean).join(" ").toLowerCase().includes(S.q);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const href = (pid, page) => "#/" + encodeURIComponent(pid) + "/" + encodeURIComponent(page);
const projectTitle = p => p.config.title || cap(p.id.replace(/[-_]+/g, " "));
function fmt(v) {
  if (typeof v !== "number" || !isFinite(v)) return "–";
  if (Number.isInteger(v)) return String(v);
  return Math.abs(v) < 10 ? v.toFixed(3) : v.toFixed(1);
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - new Date(ts)) / 1000);
  if (s < 45) return "Just now";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " hr ago";

}
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

// The mark: two solid uprights with a slanted shard hanging between them, touching neither.
const LOGO = `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor"><rect x="4.45" y="3" width="4.7" height="18"/><rect x="14.85" y="3" width="4.7" height="18"/><path d="M10.6 7.1l2.8 4.4v5.3l-2.8-4.2z"/></svg>`;

/* ---------- routing ---------- */
// Overview, Research, Live and Library first; the project's own note and table sections under More (notes also in the Library).
const PRIMARY = [["overview", "Overview"], ["research", "Research"], ["loop", "Live"], ["library", "Library"]];
function pages(p) {
  const sections = (Array.isArray(p.config.sections) ? p.config.sections : []).filter(s => s && s.id)
    .map(s => ({ id: "s." + s.id, title: s.title || s.id, section: s }));
  const topics = derive(p).topics.map(topic => ({ id: "t." + topic.key, title: topic.key, topic, inLibrary: true }));
  const groupNote = page => page.section.view === "note" && page.id !== "s.round-notes" ? { ...page, inLibrary: true } : page;
  return [...PRIMARY.map(([id, title]) => ({ id, title, primary: true })), ...sections.map(groupNote), ...topics];
}
// #/<project>/<page>, and #/<project>/research/<thread id> to open one thread.
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const p = S.projects.find(p => p.id === parts[0]) || S.projects[0] || null;
  const list = p ? pages(p) : [];
  const page = list.find(x => x.id === parts[1]) || list[0] || null;
  return { p, list, page, focus: page?.id === "research" ? parts[2] || "" : "" };
}
const threadHref = (pid, id) => href(pid, "research") + "/" + encodeURIComponent(id);

/* ---------- turn the event log into what the pages show ---------- */
let memo = { key: "", value: null };
const isClaim = n => n.status === "supported" || n.status === "reproduced";
// Where a claim stands against the project's gates, in order: how many it has passed and what is stopping it. Only a claim
// is assessed. A command gate needs an artifact to run on; a refuter works from the claim. A verdict given under other
// gates or locked files (another fingerprint) counts for nothing.
function assess(n, gates, seal) {
  if (!gates.length || !isClaim(n)) return { standing: 0, state: null, at: null };
  for (let i = 0; i < gates.length; i++) {
    const g = gates[i], got = (n.gates || {})[g.name];
    if (g.command && !n.artifact) return { standing: i, state: "unchecked", at: g.name };
    if (!got || got.fp !== seal || (got.checked || "") !== (n.artifact || "")) return { standing: i, state: "waiting", at: g.name };  // never run, or on another question or artifact
    if (got.verdict === "error" && (got.tries || 1) < 3) return { standing: i, state: "waiting", at: g.name };  // a gate that could not run is run again
    if (got.verdict !== "passed") return { standing: i, state: got.verdict === "failed" || got.verdict === "known" ? "failed" : "error", at: g.name };

}
// The frames the loop will take, in its order: the person's marks, then nearest to established, then highest score, then oldest.
const queueOrder = (a, b) => (b.priority === true) - (a.priority === true) || b.standing - a.standing || b.budget - a.budget || a.born - b.born;
// Every thread sits in exactly one of these. The Overview counts them; the Research page groups by them.
const BUCKETS = [["established", "Established"], ["stopped", "Stopped at a gate"], ["waiting", "Waiting for a gate"], ["unchecked", "Claimed, unchecked"],
  ["ruled", "Ruled out"], ["queued", "Queued"], ["aside", "Set aside"]];
function bucket(n) {
  if (isClaim(n)) return n.state === "established" ? "established" : n.state === "failed" || n.state === "error" ? "stopped" : n.state === "waiting" ? "waiting" : "unchecked";
  if (n.ruled) return "ruled";
  if (n.frame) return n.stalled ? "aside" : "queued";

const MARK_KEYS = ["priority", "status", "score", "audited", "audit_fp", "audit_artifact"];

function derive(p) {
  const ev = S.events[p.id] || [], key = p.id + ":" + ev.length + ":" + JSON.stringify(p.config);
  if (memo.key === key) return memo.value;

  let idx = -1;
  for (const e of ev) {  // older logs also hold kinds of report that are no longer shown; they fall through
    idx++;

      const s = items.get(e.section) || new Map(), old = s.get(e.key) || {};
      s.set(e.key, { ...old, ...e, text: e.text || old.text, data: e.data || old.data ? { ...old.data, ...e.data } : undefined }); items.set(e.section, s);
    }
    else if (e.type === "activity" && typeof e.data?.frame === "string" && /^Iteration \d+ started/.test(e.text || "")) {
      spent.set(e.data.frame, (spent.get(e.data.frame) || 0) + 1);  // a round is spent on its frame when it starts, so one that prints nothing still counts
    }
    else if (e.type === "research" && e.id) {
      const old = research.get(e.id);
      if (e.source === "gate") {  // one gate's verdict: it changes only that
        if (old) {
          const before = (old.gates || {})[e.gate] || {}, again = before.verdict === "error" && before.fp === e.fp && before.checked === e.checked;
          research.set(e.id, { ...old, history: [...old.history, e], gates: { ...old.gates, [e.gate]: { verdict: e.verdict, detail: e.detail, checked: e.checked, fp: e.fp, ts: e.ts,
            tries: e.verdict === "error" ? (again ? before.tries || 1 : 0) + 1 : 0 } } });
        }
        continue;
      }
      if (!e.kind) {  // a mark by the person (Pursue, Drop, Reopen, a score, their audit): it changes only that, and not the thread's age
        if (old) {
          const mark = {};
          for (const k of MARK_KEYS) if (Object.hasOwn(e, k)) mark[k] = e[k];
          research.set(e.id, { ...old, ...mark, history: [...old.history, e] });
          if (e.priority === true) spent.set(e.id, 0);  // Pursue: at the front, with its rounds to spend again
        }
        continue;
      }
      // Claimed again (an artifact named, even the same one) or reworded: a different claim, so every gate and the audit are still to come.
      const same = t => String(t || "").replace(/\s+/g, " ").trim().toLowerCase().replace(/[.!?,;: ]+$/, "");
      const fresh = old && (Object.hasOwn(e, "artifact") || (e.text && old.text && same(e.text) !== same(old.text)));
      const was = !old ? {} : fresh ? { ...old, gates: undefined, audited: undefined, audit_fp: undefined, audit_artifact: undefined } : old;
      research.set(e.id, { ...was, ...e, idx, born: old ? old.born : idx, history: [...(old?.history || []), e] });
    }
    else if (e.type === "topic" && e.key) topics.set(e.key, { ...topics.get(e.key), ...e, body: e.body || e.text || "", idx });
    else if (e.type === "question") {
      // An assumption a round made, and the person's later answer to it, are separate reports with the same id. "asker" is whoever opened it.
      const k = e.id || "_" + idx, old = questions.get(k) || {};
      questions.set(k, { ...old, ...e, id: k, text: e.text || old.text, asker: old.asker || (e.source === "you" ? "you" : "agent"),
        askedBy: old.askedBy !== undefined ? old.askedBy : (e.agent || ""), askedTs: old.askedTs || e.ts });
    }
  }
  const gates = Array.isArray(p.config.gates) ? p.config.gates : [], seal = p.config.fingerprint || "";
  for (const n of research.values()) {  // the same reading of a thread as the server's research()
    Object.assign(n, assess(n, gates, seal), { priority: n.priority === true, attempts: spent.get(n.id) || 0, budget: Number.isInteger(n.score) ? n.score : 3,
      audited: n.audited === true && n.audit_fp === seal && (n.audit_artifact || "") === (n.artifact || "") });
    const settled = n.status === "contradicted" || n.status === "superseded";
    n.ruled = n.status === "contradicted" || (n.status === "superseded" && n.history.some(e => e.status === "contradicted"));
    const known = n.state === "failed" && ((n.gates || {})[n.at] || {}).verdict === "known";  // already reported: nothing a round can repair
    n.frame = !settled && (n.status === "open" || (n.state === "failed" && !known) || (n.priority && n.state === "unchecked"));
    n.stalled = n.frame && n.attempts >= n.budget;
    n.bucket = bucket(n);
  }
  const list = [...research.values()].sort((a, b) => b.idx - a.idx);
  const queue = list.filter(n => n.frame && !n.stalled).sort(queueOrder);
  queue.forEach((n, i) => { n.place = i + 1; });
  const now = [...(items.get("now")?.values() || [])];
  const value = { items, topics: [...topics.values()], research: list, queue, loop: readLoop(ev),
    update: now.find(i => i.key === "Current update") || now.sort((a, b) => String(b.ts || "").localeCompare(String(a.ts || "")))[0] || null,
    assumptions: [...questions.values()].filter(x => x.asker === "agent" && !x.answer && x.text).sort((a, b) => Date.parse(b.askedTs) - Date.parse(a.askedTs)) };
  memo = { key, value };
  return value;
}
/* ---------- Markdown, for the notes that agents write ----------
   Everything is escaped first and only a fixed set of tags is ever produced, so agent text cannot inject markup.
   Links are kept only when they are plain http(s). */
function mdInline(s) {
  return s.split(/(`[^`\n]+`)/).map(part => {
    if (part.length > 2 && part[0] === "`" && part[part.length - 1] === "`") return `<code>${esc(part.slice(1, -1))}</code>`;
    return esc(part)
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*\n]*)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");

}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const bullet = /^(\s*)([-*]|\d+[.)])\s+(.*)$/;
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(mdInline).join("<br>")}</p>`); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      flush(); const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push(`<pre>${esc(code.join("\n"))}</pre>`);
    } else if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?[\s:|-]*-{2,}[\s:|-]*$/.test(lines[i + 1] || "")) {
      flush(); const head = cells(l), rows = []; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="scrollx"><table><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr>${rows.map(r => `<tr>${head.map((_, k) => `<td>${mdInline(r[k] || "")}</td>`).join("")}</tr>`).join("")}</table></div>`);
    } else if (/^#{1,6}\s+/.test(l)) {
      flush(); out.push(`<h3>${mdInline(l.replace(/^#{1,6}\s+/, ""))}</h3>`); i++;
    } else if (bullet.test(l)) {
      flush(); const ordered = /^\s*\d/.test(l), items = [];
      while (i < lines.length && (bullet.test(lines[i]) || (/^\s+\S/.test(lines[i]) && items.length))) {
        const m = lines[i].match(bullet);
        if (m) items.push({ depth: Math.min(3, Math.floor(m[1].length / 2)), text: m[3] }); else items[items.length - 1].text += " " + lines[i].trim();
        i++;
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(it => `<li style="margin-left:${it.depth * 1.2}em">${mdInline(it.text)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (!l.trim()) { flush(); i++; }
    else { para.push(l); i++; }
  }
  flush();
  return out.join("");
}

/* ---------- shared bits of markup ---------- */
const empty = text => `<div class="empty">${esc(text)}</div>`;
const bare = text => `<div class="box glass">${empty(text)}</div>`;  // an empty state shown on its own, outside any panel
function more(key, label, content) {
  if (!content) return "";
  const open = S.open.has(key);
  return `<div class="mt"><button class="link" data-open="${esc(key)}" data-fk="open:${esc(key)}" aria-expanded="${open}">${open ? "Hide " : "Show "}${label}</button>${open ? (label === "note" ? `<div class="md inset">${md(content)}</div>` : `<pre>${esc(content)}</pre>`) : ""}</div>`;
}
function statusPill(status, sec) {
  if (!status) return "";
  const list = sec && Array.isArray(sec.statuses) ? sec.statuses : [], i = list.indexOf(status);
  const cls = i < 0 || list.length < 2 ? "" : i === list.length - 1 ? "solid" : i === 0 ? "" : "info";
  return `<span class="pill ${cls}">${esc(cap(status))}</span>`;
}

// Every list that can grow without limit goes through here: it shows the newest few and a button for more, so no page
// keeps getting longer as a project runs. The count shown per list is remembered until you leave the page.
function paged(key, list, step, render, wrap = x => x) {
  const n = S.limit[key] || step, rest = list.length - n;
  return wrap(list.slice(0, n).map(render).join(""))
    + (rest > 0 ? `<div class="actions"><button class="btn small ghost" data-more="${esc(key)}" data-step="${step}" data-fk="more:${esc(key)}">Show ${Math.min(step * 2, rest)} more</button><span class="sub">${n} of ${list.length} shown</span></div>` : "");
}

/* ---------- pages ---------- */
function novelty(x) {
  const known = typeof x?.known === "string" ? x.known.trim() : "";
  return !known ? "Novelty not stated" : known.toLowerCase() === "new" ? "Agent says this is new, and that it looked" : "Already known: " + known;
}
// One gate as it stands for one claim: [pill class, mark, short word, sentence]. Only a gate's own verdict is ever styled as a pass.
function gateState(n, g, i, seal) {
  const got = (n.gates || {})[g.name], live = got && got.fp === seal;
  if (i < n.standing && live) return ["solid", "✓ ", g.refute ? "not refuted" : "passed", g.refute ? "Not refuted" : "Passed"];
  if (i !== n.standing) return ["", "", "not reached", "Not reached"];
  if (n.state === "failed" && got?.verdict === "known") return ["bad", "✗ ", "already known", "Already known: a refuter cited where. It is not queued again"];
  if (n.state === "failed") return ["bad", "✗ ", g.refute ? "refuted" : "failed", g.refute ? "Refuted" : "Failed"];
  if (n.state === "error") return ["bad", "! ", "could not run", "Could not run"];
  if (n.state === "unchecked") return ["", "", "needs an artifact", "Needs an artifact: the claim names none for this command to run on"];
  return ["info", "… ", got ? "due again: the gates or locked files changed" : "due", got ? "Due again: the gates or the locked files changed since it ran" : "Due after the round ends"];
}
const auditPill = n => n.audited ? '<span class="pill ok">Audited by you</span>' : "";
function gatePills(n, p) {
  if (n.state === null) return auditPill(n);
  return (p.config.gates || []).map((g, i) => {
    const [cls, mark, word] = gateState(n, g, i, p.config.fingerprint || "");
    return `<span class="pill ${cls}" title="${esc(g.name)}: ${word}">${mark}${esc(g.name)}</span>`;
  }).join("") + auditPill(n);
}
// Where a thread stands, in a few words: for the Copy for Claude line and the details.
function standsText(n, p) {
  const gates = p.config.gates || [], rounds = `${n.attempts} of ${plural(n.budget, "round")} spent`;
  const turn = n.place ? `, #${n.place} in the queue` : n.stalled ? ", set aside" : "";
  switch (n.bucket) {
    case "established": return `established: passed all ${plural(gates.length, "gate")}`;
    case "stopped": return `stopped at gate "${n.at}" (${n.state === "failed" ? "failed" : "could not run"})${turn}`;
    case "waiting": return `claimed, waiting for gate "${n.at}" (${n.standing} of ${gates.length} passed)${turn}`;
    case "unchecked": return (gates.length ? `claimed, unchecked: gate "${n.at}" needs an artifact` : "claimed; this project has no gates") + turn;
    case "ruled": return "ruled out";
    case "queued": return `queued #${n.place}, ${rounds}`;
    case "aside": return `set aside, ${rounds}`;
    default: return n.status === "superseded" ? "dropped" : n.status || "no status";
  }
}
function copyThread(id) {
  const { p } = route(), n = derive(p).research.find(x => x.id === id);
  if (!n) return;
  copy(`Hades project ${p.id}, thread [${n.id}]: "${n.text || ""}" (${standsText(n, p)}). ${location.origin}${location.pathname}${threadHref(p.id, n.id)}`, "Thread reference copied");
}
// Pursue marks a thread as a priority (and un-marks it); Drop sets it aside (superseded). A thread ruled out or dropped can be reopened.
function threadActions(n) {
  if (!n?.id) return "";
  const prio = n.priority === true, settled = n.status === "superseded" || n.status === "contradicted", key = "thread:" + n.id, open = S.open.has(key);
  return `<div class="claim-actions">${settled ? `<button class="btn small ghost" data-thread-status="open" data-id="${esc(n.id)}" data-fk="drop:${esc(n.id)}" title="Make it an open frame again">Reopen</button>`
    : `<button class="btn small ghost" data-priority="${esc(n.id)}" data-fk="pursue:${esc(n.id)}" aria-pressed="${prio}" title="${prio ? "Marked as a priority. Press to remove the mark." : "Put this at the front of the queue, with its rounds to spend again"}">${prio ? "★ Pursuing" : "Pursue"}</button>
    <button class="btn small ghost" data-thread-status="superseded" data-id="${esc(n.id)}" data-fk="drop:${esc(n.id)}">Drop</button>`}
    <button class="btn small ghost" data-copy-thread="${esc(n.id)}" data-fk="copy:${esc(n.id)}" title="Copy a one-line reference to this thread for a chat with Claude">Copy for Claude</button>
    <button class="btn small ghost" data-open="${esc(key)}" data-fk="open:${esc(key)}" aria-expanded="${open}">${open ? "Hide details" : "Details"}</button></div>`;
}

// Everything else a thread carries, shown under "Details".
function threadDetails(n, all, p) {
  const byId = new Map(all.map(x => [x.id, x])), gates = p.config.gates || [], seal = p.config.fingerprint || "";
  const link = (id, label) => byId.has(id)
    ? `<button class="btn small ghost" data-research-target="${esc(id)}">${esc(label || byId.get(id).text)}</button>`
    : `<span class="pill">${esc(label || id)} (missing)</span>`;
  const author = e => e.source === "you" ? "You" : e.agent || "Agent";
  const incoming = all.flatMap(x => (x.links || []).filter(l => l.to === n.id).map(l => ({ ...l, from: x.id })));
  const history = (n.history || []).slice().reverse().map((e, i) => {
    const changes = e.source === "gate" ? [`${e.gate}: ${e.verdict === "passed" ? "passed" : e.verdict === "failed" ? "failed" : e.verdict === "known" ? "already known" : "could not run"}`]
      : ["text", "kind", "status", "area", "scope", "snapshot", "body", "conditions", "next", "evidence", "links", "priority", "artifact", "score", "audited"]
      .filter(k => Object.hasOwn(e, k) && (k !== "text" || e.text)).map(k => k === "text" ? "claim" : k === "next" ? "next test" : k === "priority" ? (e.priority ? "marked as a priority" : "priority removed")
        : k === "artifact" ? "artifact to check" : k === "score" ? `worth ${e.score} rounds` : k === "audited" ? (e.audited ? "audited" : "audit removed") : k);
    return `<div class="card"><div class="row"><span>${esc(e.source === "gate" ? "Gate" : i === (n.history || []).length - 1 ? "Created" : "Updated")}${e.source === "gate" ? "" : " by " + esc(author(e))}</span><span class="sub">${ago(e.ts)}</span></div>
      <div class="sub">${esc(changes.join(", "))}${e.status ? ` · ${esc(e.status)}` : ""}${e.snapshot ? ` · ${esc(e.snapshot)}` : ""}</div>
      ${e.text ? `<div>${esc(e.text)}</div>` : ""}${e.next ? `<div class="sub">Next test: ${esc(e.next)}</div>` : ""}
      ${e.evidence?.length ? `<div class="sub">Evidence: ${esc(e.evidence.map(x => x.ref).join("; "))}</div>` : ""}</div>`;
  }).join("");
  const hk = "history:" + n.id, showHistory = S.open.has(hk);
  return `<div class="thread-details">
    <div class="sub">${esc(n.id)} · ${esc(n.kind || "thread")} · ${esc(standsText(n, p))}${n.area ? ` · ${esc(n.area)}` : ""}${n.origin === "handoff" ? " · from a handoff" : ""} · ${esc(author(n))}</div>
    ${n.scope || n.snapshot ? `<div class="card mt2"><div class="sub">Research context</div>${n.scope ? `<div><b>Scope:</b> ${esc(n.scope)}</div>` : ""}${n.snapshot ? `<div><b>Snapshot:</b> <code>${esc(n.snapshot)}</code></div>` : ""}</div>` : ""}
    ${n.found_in ? `<div class="sub mt2">Found while looking at: ${esc(n.found_in)}</div>` : ""}
    ${n.body ? `<div class="md mt2">${md(n.body)}</div>` : ""}
    ${n.frame ? `<div class="sub mt2">${n.stalled ? `Set aside: its ${n.budget} round${n.budget === 1 ? " is" : "s are"} spent, so the loop has moved on. Pursue gives it ${n.budget} more.` : `${n.attempts} of ${n.budget} round${n.budget === 1 ? "" : "s"} spent on it.`}</div>` : ""}
    ${n.state !== null ? `<div class="card mt2"><div class="sub">Gates${n.artifact ? `, run on <code>${esc(n.artifact)}</code>` : ", with no artifact named"}</div>${gates.map((g, i) => {
      const got = (n.gates || {})[g.name], live = got && got.fp === seal;
      return `<div class="gate-row"><b>${esc(g.name)}</b> · ${gateState(n, g, i, seal)[3]}${live && got.detail && i <= n.standing ? `<pre class="check-out">${esc(got.detail)}</pre>` : ""}</div>`; }).join("")}</div>` : ""}
    ${n.conditions ? `<div class="card mt2"><div class="sub">Conditions</div>${esc(n.conditions)}</div>` : ""}
    ${n.next ? `<div class="card mt2"><div class="sub">Next discriminating test</div>${esc(n.next)}</div>` : ""}
    ${(n.evidence || []).length ? `<div class="card mt2"><div class="sub">Evidence</div>${n.evidence.map(x => `<div><code>${esc(x.ref)}</code>${x.note ? ` — ${esc(x.note)}` : ""}</div>`).join("")}</div>` : ""}
    ${(n.links || []).length ? `<div class="card mt2"><div class="sub">Links</div>${n.links.map(x => `<div>${esc(x.relation)} ${link(x.to)}</div>`).join("")}</div>` : ""}
    ${incoming.length ? `<div class="card mt2"><div class="sub">Linked from</div>${incoming.map(x => `<div>${link(x.from)} ${esc(x.relation)}</div>`).join("")}</div>` : ""}
    <div class="actions">${isClaim(n) ? `<button class="btn small ghost" data-audit="${esc(n.id)}" data-fk="audit:${esc(n.id)}" aria-pressed="${n.audited === true}" title="Your own check of this claim. It lapses if the artifact, the gates or the locked files change.">${n.audited ? "Audited by you" : "Mark as audited"}</button>` : ""}<button class="btn small ghost" data-open="${esc(hk)}" aria-expanded="${showHistory}">${showHistory ? "Hide" : "Show"} history (${(n.history || []).length})</button></div>
    ${showHistory ? `<div class="mt2">${history}</div>` : ""}</div>`;
}

// An assumption a round made where only the person could decide. It stays in force until the person answers it.
function assumptionRow(x, overrule) {
  return `<article class="claim plain"><h3>${esc(x.text)}</h3>
    <div class="claim-foot"><span class="sub">Assumed by ${esc(x.askedBy || "a round")} ${esc(ago(x.askedTs).toLowerCase())}${x.origin === "handoff" ? " · from a handoff" : ""}</span>
    ${overrule && String(x.id)[0] !== "_" ? `<button class="btn small ghost" data-overrule="${esc(x.id)}" data-fk="overrule:${esc(x.id)}" aria-haspopup="dialog">Overrule</button>` : ""}</div></article>`;
}
function gateLine(p) {
  const gates = p.config.gates || [];
  if (!gates.length) return "This project has no gates, so every result is the agent's claim.";
  if (p.config.default_gates) return `Every claim goes through the built-in refutation gate, <b>${esc(gates[0].name)}</b>: a fresh round is shown only the claim and told to kill it.`;
  return `A result is established only when it passes this project's gate${gates.length > 1 ? "s, in order" : ""}: ${gates.map(g => `<b>${esc(g.name)}</b>`).join(" → ")}.`;
}

const CLAIM_BUCKETS = ["established", "stopped", "waiting", "unchecked"];
const RESEARCH_TIMES =[["all", "All"], ["night", "Since last night"], ["day", "Last 24 hours"]];
const GROUP_NOTES = {
  stopped: "A gate said no. Each goes back in the queue, so a round can repair it or rule it out.",
  waiting: "The loop runs the next gate after the current round ends.",
  queued: "What the loop will work, in the order it takes them: open frames, and claims a gate stopped.",
  aside: "Their rounds are spent, so the loop has moved on. Pursue gives one its rounds again.",
  dropped: "Set aside by hand. Reopen brings one back."
};
function researchPanel(p, d) {
  const time = RESEARCH_TIMES.some(([k]) => k === S.researchTime) ? S.researchTime : "all";
  const night = new Date();  // "last night" starts at 8 PM yesterday, or today once it is past 8 PM
  night.setHours(20, 0, 0, 0);
  if (night > new Date()) night.setDate(night.getDate() - 1);
  const inside = time === "night" ? ts => Date.parse(ts) >= +night && Date.parse(ts) <= Date.now() + 1 : time === "day" ? ts => Date.parse(ts) > Date.now() - 864e5 : () => true;
  const gates = p.config.gates || [], focus = route().focus;
  const g = Object.fromEntries([...BUCKETS.map(([k]) => k), "dropped"].map(k => [k, []]));
  for (const n of d.research) {
    if (!hit(n.id, n.text, n.body, n.area, n.scope, n.next, n.known)) continue;
    const turned = (n.history || []).filter(e => e.status === "contradicted").pop();
    const ts = n.bucket === "ruled" ? turned?.ts || n.ts : isClaim(n) ? (n.history || [])[0]?.ts || n.ts : n.ts;
    if (!inside(ts) && n.id !== focus) continue;
    g[n.bucket].push({ thread: n, ts, reason: n.bucket === "ruled" ? turned?.conditions || turned?.body || n.conditions || n.body || "" : "" });
    if (isClaim(n) && n.frame) g[n.stalled ? "aside" : "queued"].push({ thread: n, ts, ref: true });  // listed with its claim group too
  }
  const newest = (a, b) => Date.parse(b.ts) - Date.parse(a.ts);
  const rank = (a, b) => (b.thread.audited === true) - (a.thread.audited === true) || b.thread.standing - a.thread.standing ||
    (b.thread.priority === true) - (a.thread.priority === true) || newest(a, b);
  for (const k of CLAIM_BUCKETS) g[k].sort(rank);
  g.ruled.sort(newest); g.dropped.sort(newest);
  g.queued.sort((a, b) => queueOrder(a.thread, b.thread)); g.aside.sort((a, b) => queueOrder(a.thread, b.thread));

  const records = time === "all" ? [] : (S.events[p.id] || []).filter(e => ["activity", "item", "question", "research", "topic"].includes(e.type) && inside(e.ts) && hit(e.key, e.text, e.id, e.body));
  const short = ts => new Date(ts).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  const clip = (s, n = 320) => { s = String(s || "").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  const by = x => x.thread.agent || (x.thread.source === "you" ? "you" : "");
  const when = x => `${esc(ago(x.ts).toLowerCase())}${by(x) ? " · " + esc(by(x)) : ""}${x.thread.origin === "handoff" ? " · from a handoff" : ""}`;
  const details = n => S.open.has("thread:" + n.id) ? threadDetails(n, d.research, p) : "";
  const turnPill = n => n.place === 1 ? '<span class="pill info">Next up</span>' : n.place ? `<span class="pill">#${n.place} in queue</span>` : n.stalled ? '<span class="pill">Set aside</span>' : "";
  const anchor = n => ` id="research-${esc(n.id)}"`;
  const dropped = n => n.status === "superseded" && !n.ruled ? '<span class="pill">Dropped</span>' : "";
  // A claim is what the agent says. Only the project's gates establish it.
  const claim = x => {
    const n = x.thread, says = n.body ? clip(n.body) : n.origin === "handoff" ? "Claimed in its closing handoff." : "No further detail given.";
    return `<article class="claim"${anchor(n)}>
      <div class="row"><h3>${esc(n.text || "Untitled claim")}</h3><span class="tags">${turnPill(n)}${gatePills(n, p)}</span></div>
      <p class="sub">${esc(says)}</p>
      <div class="claim-foot"><span class="sub">${esc(novelty(n))} · ${when(x)}</span>${threadActions(n)}</div>${details(n)}</article>`;
  };
  const plain = x => {
    const n = x.thread, ruled = n.bucket === "ruled";
    return `<article class="claim plain${n.bucket === "dropped" ? " dropped" : ""}"${anchor(n)}>
    <div class="row"><h3>${esc(n.text || "Untitled thread")}</h3><span class="tags">${dropped(n)}${turnPill(n)}</span></div>
    ${ruled ? (x.reason ? `<p class="sub">${esc(clip(x.reason, 400))}</p>` : n.origin === "handoff" ? "" : '<p class="sub">No reason was given.</p>') : n.next ? `<p class="sub">Next: ${esc(clip(n.next, 300))}</p>` : ""}
    <div class="claim-foot"><span class="sub">${esc(n.kind === "hypothesis" && (n.origin === "handoff" || n.origin === "queue") ? "frame" : n.kind || "frame")}${n.frame ? ` · ${n.attempts} of ${n.budget} rounds spent` : ""} · ${when(x)}</span>${threadActions(n)}</div>${details(n)}</article>`;
  };
  // A claim that is also in the queue, or set aside, is shown in full with its claim group; here, one line that leads to it.
  const ref = x => { const n = x.thread; return `<article class="claim plain"><div class="row"><h3>${esc(n.text || "Untitled claim")}</h3><span class="tags">${turnPill(n)}</span></div>
    <div class="claim-foot"><span class="sub">${esc(cap(standsText(n, p)))}</span><button class="btn small ghost" data-research-target="${esc(n.id)}" data-fk="goto:${esc(n.id)}">Show the claim</button></div></article>`; };
  const group = (key, title) => {
    const list = g[key], pk = "research:" + key;
    if (!list.length) return "";
    const at = focus ? list.findIndex(x => x.thread.id === focus && !x.ref) : -1;
    if (at >= (S.limit[pk] || 8)) S.limit[pk] = at + 1;  // a link to one thread shows it, however far down its group it is
    return `<section class="night-group" id="research-group-${key}" aria-label="${esc(title)}"><h2>${esc(title)} <span class="pill">${list.length}</span></h2>
    ${GROUP_NOTES[key] ? `<p class="sub group-note">${GROUP_NOTES[key]}</p>` : ""}
    ${paged(pk, list, 8, x => CLAIM_BUCKETS.includes(key) ? claim(x) : x.ref ? ref(x) : plain(x), html => `<div class="claim-list">${html}</div>`)}</section>`;
  };
  const label = e => e.type === "item" ? e.section === "round-notes" ? "Round note" : "Project note" : e.type === "topic" ? "Library page" : e.type === "question" ? "Assumption" : cap(e.type);
  const line = e => `<article class="result-entry"><div class="sub">${esc(short(e.ts))} · ${esc(label(e))}${e.agent ? " · " + esc(e.agent) : ""}</div>
    <div>${esc(e.key || e.text || e.id || e.type)}</div>${e.key && e.text ? `<div class="sub">${esc(e.text)}</div>` : ""}
    ${e.body ? more("record:" + p.id + ":" + (e.key || e.id || "") + ":" + e.ts, "saved note", e.body) : ""}</article>`;
  const logKey = "research-log:" + p.id + ":" + time;
  // Assumptions are always shown, whatever the time filter: they shape every round until someone overrules them.
  const assumed = d.assumptions.filter(x => hit(x.text, x.askedBy));
  const assumptions = assumed.length ? `<section class="night-group" id="research-assumptions" aria-labelledby="assume-h"><h2 id="assume-h">Assumptions the loop is working under <span class="pill">${assumed.length}</span></h2>
    <p class="sub group-note">Where a round needed a call only you can make, it assumed this and kept going. Overrule one to change what later rounds assume.</p>
    ${paged("research:assumptions", assumed, 6, x => assumptionRow(x, true), html => `<div class="claim-list">${html}</div>`)}</section>` : "";
  const count = Object.values(g).reduce((n, list) => n + list.length, 0);
  const none = S.q ? "Nothing matches your search." : time === "all" ? (d.research.length ? "Nothing to show yet." : "No research yet. Start a loop; what each round claims and rules out lands here.")
    : time === "night" ? "Nothing was claimed or ruled out since 8 PM last night." : "Nothing was claimed or ruled out in the last 24 hours.";
  return `<p class="sub check-line">${gateLine(p)}${gates.length ? " Claims are ranked by how many they have passed." : ""}</p>
    ${assumptions}
    <div class="research-options"><div class="seg" role="group" aria-label="Show research from">${RESEARCH_TIMES.map(([k, label]) =>
      `<button data-research-time="${k}" data-fk="rtime:${k}" aria-pressed="${time === k}">${label}</button>`).join("")}</div></div>
    ${BUCKETS.map(([k, title]) => group(k, k === "unchecked" && !gates.length ? "Claimed" : k === "queued" ? "Queued, in the order the loop takes them" : title)).join("")}
    ${group("dropped", "Dropped")}
    ${count ? "" : bare(none)}
    ${records.length ? `<details class="disclosure" data-keep-details="${esc(logKey)}" ${S.open.has(logKey) ? "open" : ""}><summary>Everything recorded in this window, in order (${records.length})</summary>
      ${paged("records:" + time, records.slice().reverse(), 12, line, html => `<div class="result-list">${html}</div>`)}</details>` : ""}`;
}

/* ---------- Overview: is it running, what is it doing, what has been established, what is stuck, what is next ---------- */
const liveLaunch = p => (p.launched || []).filter(x => x.alive).pop() || null;
function overview(p, d) {
  const gates = p.config.gates || [], live = liveLaunch(p), paused = !!(p.hold || p.config.paused);
  // Each claim counts once by where it stands against the gates; Queued and Set aside count every frame, claims a gate stopped included.
  const counts = Object.fromEntries(BUCKETS.map(([k]) => [k, 0]));
  for (const n of d.research) {
    if (n.bucket in counts) counts[n.bucket]++;
    if (isClaim(n) && n.frame) counts[n.stalled ? "aside" : "queued"]++;
  }
  // Status: running, idle or paused; what runs; which round; what the round is doing.
  const cur = live && [...d.loop.rounds].reverse().find(r => r.agent === live.agent && (!live.session || !r.session || r.session === live.session));
  const recipe = live ? (p.launchers || {})[live.recipe]?.label || live.recipe : "", total = live?.settings?.rounds;
  const [tone, word] = !S.connected ? ["stop", "Disconnected"] : paused ? ["idle", "Paused"] : live ? ["work", "Running"] : ["idle", "Idle"];
  const frame = cur?.frame ? d.research.find(n => n.id === cur.frame) : null;
  const doing = live && cur ? (cur.frame ? `Settling <b>[${esc(cur.frame)}]</b> ${esc(frame?.text || "")}` : "Widening: looking for places to look") : "";
  const stop = d.loop.lastStop;
  const facts = live ? [recipe, live.model, cur && `round ${cur.number}${Number.isInteger(total) && total > 0 ? " of " + total : total === 0 ? ", until stopped" : ""}`].filter(Boolean)
    : [stop ? `${stop.text} ${ago(stop.ts).toLowerCase()}` : d.loop.rounds.length ? "" : "Nothing has run yet"].filter(Boolean);
  const status = `<section class="ov-status" aria-label="Loop status">
    <div class="ov-line"><span class="term-state" data-tone="${tone}"><i aria-hidden="true"></i><span>${word}</span></span>
      <span class="sub">${esc(facts.join(" · "))}</span></div>
    ${doing ? `<p class="ov-doing">${doing}</p>` : ""}
    ${p.config.problem ? `<p class="sub" role="alert">${esc(cap(p.config.problem))}. The loop holds until the file is fixed.</p>` : ""}
    <div class="ov-controls">${live ? `<span class="loop-start">${stopButtons(live)}<button class="btn small ghost" type="button" data-loop-settings data-fk="loop-settings" aria-haspopup="dialog">Settings</button></span>` : startBar(p)}</div></section>`;
  // The funnel: one count per bucket, each a way into its group on Research.
  const tile = ([k, title]) => {
    const n = counts[k], label = k === "unchecked" && !gates.length ? "Claimed" : title;
    return n ? `<a class="tile" href="${href(p.id, "research")}" data-goto="${k}" data-fk="tile:${k}"><b>${n}</b><span>${esc(label)}</span></a>`
      : `<span class="tile zero"><b>0</b><span>${esc(label)}</span></span>`;
  };
  const funnel = `<nav class="funnel" aria-label="Research, by where each thread stands">${BUCKETS.map(tile).join("")}</nav>`;
  const next = d.queue.slice(0, 3);
  const nextUp = `<section class="box glass" aria-labelledby="next-h"><h2 id="next-h">Next up</h2>${next.length ? `<ol class="rows">${next.map(n =>
    `<li><a href="${threadHref(p.id, n.id)}" data-fk="next:${esc(n.id)}"><span class="sub num">${n.place}.</span> [${esc(n.id)}] ${esc(n.text || "")}</a>
      <span class="sub nowrap">${n.priority ? "★ " : ""}${n.attempts} of ${n.budget} rounds</span></li>`).join("")}</ol>${d.queue.length > 3 ? `<p class="sub mt">and ${d.queue.length - 3} more queued</p>` : ""}`
    : empty("Nothing is queued, so the next round widens: it looks for new places to look.")}</section>`;
  const gateBox = `<section class="box glass" aria-labelledby="gates-h"><h2 id="gates-h">Gates</h2>
    ${!gates.length ? empty("No gates: every result is a claim.") : `${p.config.default_gates ? '<p class="sub">The built-in refutation gate: a fresh round is shown only the claim and told to kill it.</p>' : ""}
    <ol class="rows">${gates.map((g, i) => `<li><span><span class="sub num">${i + 1}.</span> <b>${esc(g.name)}</b></span>
      <span class="pill" title="${esc(g.command ? g.command.join(" ") : g.refute)}">${g.command ? "command" : "refuter"}</span></li>`).join("")}</ol>`}</section>`;
  const u = d.update, text = u ? u.body || u.text || "" : "", date = u?.ts && new Date(u.ts);
  // A long handoff opens with its first paragraphs, so the rest of the Overview stays in view.
  const paras = text.split(/\n\s*\n/), long = text.length > 900, hk = "handoff:" + p.id, whole = !long || S.open.has(hk);
  let preview = "";
  for (const x of paras) { if (preview && preview.length + x.length > 700) break; preview += (preview ? "\n\n" : "") + x; }
  if (preview.length > 900) preview = preview.slice(0, 700) + "…";
  const stamp = date && Number.isFinite(date.getTime()) ? date.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
  const handoff = `<section class="box glass" aria-labelledby="handoff-h"><div class="row"><h2 id="handoff-h">Latest handoff</h2>
    ${u ? `<span class="sub">${stamp ? `<time datetime="${esc(u.ts)}" title="${esc(stamp)}">${esc(ago(u.ts))}</time>` : ""}${u.agent ? " · " + esc(u.agent) : ""}</span>` : ""}</div>
    ${text ? `<div class="md">${md(whole ? text : preview)}</div>` : empty("No handoff yet. Each round's closing handoff lands here.")}
    ${long ? `<div class="actions"><button class="btn small ghost" data-open="${esc(hk)}" data-fk="open:${esc(hk)}" aria-expanded="${whole}">${whole ? "Show less" : "Read all of it"}</button></div>` : ""}</section>`;
  const assumptions = d.assumptions.length ? `<section class="box glass" aria-labelledby="ov-assume-h"><div class="row"><h2 id="ov-assume-h">Assumptions in force <span class="pill">${d.assumptions.length}</span></h2>
    <a class="sub" href="${href(p.id, "research")}" data-goto="assumptions">Overrule on Research</a></div>
    ${paged("ov-assumptions", d.assumptions, 5, x => assumptionRow(x, false), html => `<div class="claim-list mt">${html}</div>`)}</section>` : "";
  const said = k => typeof p.config[k] === "string" ? p.config[k].trim() : "";
  const brief = [["Goal", said("goal")], ["Target", said("target")], ["Direction", said("direction")]].filter(([k, v]) => v || k === "Goal");
  const about = `<dl class="kv ov-facts">${brief.map(([k, v]) => `<dt>${k}</dt><dd>${v ? esc(v) : '<span class="sub">Not set</span>'}</dd>`).join("")}</dl>`;
  return `<header class="pagehead"><h1>${esc(projectTitle(p))}</h1>${p.config.summary ? `<p class="goal">${esc(p.config.summary)}</p>` : ""}</header>
    ${status}${funnel}<div class="ov-grid">${nextUp}${gateBox}</div>${handoff}${assumptions}${about}${steerByHand(p)}`;
}

/* ---------- Steer by hand: the goal, target, direction and pause, for when the person would rather not ask Claude ---------- */
let hand = { project: "", goal: "", target: "", direction: "", saving: false, error: "" };
function steerByHand(p) {
  const mine = hand.project === p.id, value = k => mine ? hand[k] : typeof p.config[k] === "string" ? p.config[k] : "";
  const key = "hand:" + p.id, paused = !!p.config.paused, open = S.open.has(key) || !String(p.config.goal || "").trim();
  return `<details class="disclosure" data-keep-details="${esc(key)}" ${open ? "open" : ""}><summary data-fk="hand">Steer by hand</summary>
    <form class="hand-form" data-hand-form>
      <label class="lbl" for="hand-goal">Goal</label>
      <textarea class="field" id="hand-goal" name="goal" rows="3" maxlength="2000" data-fk="hand-goal" placeholder="What should be researched?">${esc(value("goal"))}</textarea>
      <label class="lbl" for="hand-target">Target <span class="sub">optional: a folder, repository, paper or URL</span></label>
      <input class="field" id="hand-target" name="target" maxlength="4000" autocomplete="off" data-fk="hand-target" value="${esc(value("target"))}">
      <label class="lbl" for="hand-direction">Direction for every round <span class="sub">optional; leave empty for none</span></label>
      <textarea class="field" id="hand-direction" name="direction" rows="3" maxlength="4000" data-fk="hand-direction">${esc(value("direction"))}</textarea>
      ${mine && hand.error ? `<p class="form-error" role="alert">${esc(hand.error)}</p>` : ""}
      <div class="actions"><button class="btn small" type="submit" data-fk="hand-save" ${mine && hand.saving ? "disabled" : ""}>${mine && hand.saving ? "Saving…" : "Save"}</button>
        ${mine ? '<button class="btn small ghost" type="button" data-hand-reset data-fk="hand-reset">Discard changes</button>' : ""}
        <button class="btn small ghost" type="button" data-pause="${paused ? "" : "1"}" data-fk="hand-pause">${paused ? "Resume the loop" : "Pause the loop"}</button></div>
    </form></details>`;
}
async function saveHand(p, form) {
  const goal = form.goal.value.trim(), target = form.target.value.trim(), direction = form.direction.value.trim();
  hand = { project: p.id, goal: form.goal.value, target: form.target.value, direction: form.direction.value, saving: !!goal, error: goal ? "" : "Write the goal first: a sentence or two on what should be researched." };
  render(true);
  if (!goal) { document.querySelector('[data-fk="hand-goal"]')?.focus({ preventScroll: true }); return; }
  try {
    const r = await fetch("/api/project", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: p.id, goal, target, direction }) });
    if (!r.ok) throw Error((await r.json().then(j => j && j.error, () => null)) || "the server answered " + r.status);
    // Read it back: a server that ignores a field must not look like it saved.
    const kept = (await getJSON("/api/projects")).find(x => x.id === p.id)?.config || {};
    if (String(kept.goal || "").trim() !== goal || String(kept.direction || "").trim() !== direction) throw Error("the server did not keep it");
    hand = { project: "", goal: "", target: "", direction: "", saving: false, error: "" };
    toast("Saved. The next round's brief uses it.");
    await poll();
  } catch (error) {
    hand = { ...hand, saving: false, error: "Not saved: " + (error instanceof TypeError ? "the server could not be reached" : error.message) + ". Your text is still here." };
  }
  render(true);
}
const pinnedRounds = new Map();

// Terminal output stays in this browser tab. It never enters the project event log.
const attachedLogs = new Map();
let terminalView = { key: "", text: "", info: "" };
const terminalDrafts = new Map();  // message drafts, one per worker terminal

function runInfoButton(p, agent, session, number) {
  return `<button type="button" class="run-info-button" data-run-info data-project="${esc(p.id)}" data-agent="${esc(agent)}" data-session="${esc(session || "")}" data-round="${esc(number)}" aria-label="Run details for ${esc(agent)}, iteration ${esc(number)}" aria-haspopup="dialog" title="Run details">i</button>`;
}

let detailsTimer = 0, detailsSequence = 0;
async function showRunInfo(button) {
  const dialog = $("#run-info"), body = $("#run-info-content");
  const {project, agent, session, round} = button.dataset;
  const sequence = ++detailsSequence;
  const params = new URLSearchParams({project, agent, session, round});
  $("#run-info-round").textContent = `${agent} · Iteration ${round}`;
  body.textContent = "Loading invocation…";
  dialog.showModal();
  let previous = "";
  async function read() {
    try {
      const response = await fetch("/api/run-details?" + params, {cache: "no-store"});
      if (!response.ok) throw Error(response.status === 403 ? "Open Hades on localhost to read run details." : "Could not load run details.");
      const records = await response.json();
      if (sequence !== detailsSequence || !dialog.open) return;
      const signature = JSON.stringify(records);
      if (previous !== signature) {
        previous = signature;
        const cli = records.filter(r => r.stage === "cli");
        const section = r => {
          const el = document.createElement("section");
          el.innerHTML = '<p class="sub"></p><h3>Command</h3><pre></pre><h3>Standard input</h3><pre></pre>';
          el.querySelector("p").textContent = r.source;
          const [cmd, input] = el.querySelectorAll("pre");
          cmd.textContent = r.command;
          input.textContent = r.stdin || "(empty)";
          return el;
        };
        const wrapper = records.filter(r => r.stage === "wrapper");
        body.replaceChildren(...cli.map(section));
        if (!cli.length) body.textContent = wrapper.length ? "Final CLI invocation has not been captured." : "No invocation was recorded for this iteration.";
        if (wrapper.length) {
          const outer = document.createElement("details");
          outer.innerHTML = "<summary>Original wrapper command and input</summary>";
          outer.append(...wrapper.map(section));
          body.append(outer);
        }
      }
    } catch (error) {
      if (sequence !== detailsSequence || !dialog.open) return;
      previous = ""; body.textContent = error.message;
    }
    if (sequence === detailsSequence && dialog.open) detailsTimer = setTimeout(read, 2000);
  }
  read();
}
$("#run-info").addEventListener("close", () => { ++detailsSequence; clearTimeout(detailsTimer); });

function terminalLaunch(p, round) {
  const launches = p.launched || [];
  const selected = launches.find(x => x.session && x.session === round?.session);
  if (pinnedRounds.has(p.id)) return selected;
  if (selected?.alive) return selected;
  return [...launches].reverse().find(x => x.alive && x.session) || selected;
}

let stopArmed = { agent: "", until: 0 };   // "Stop" asks once inline; a modal would not survive the next re-render
let terminalDrawn = { el: null, text: "" };

// Reads the transcript grammar that scripts/loop.py prints. Other harnesses print anything, which falls through to plain prose.
// Every piece of transcript text passes through esc(); only these fixed spans are added around it.
const TOOL_CALL = /^(\s*)> ([A-Za-z_][\w.:\/-]*)(?=\s{2}|$)(.*)$/;
function transcriptHTML(text) {
  const lines = String(text || "").split("\n");
  if (lines[lines.length - 1] === "") lines.pop();
  const blocks = [], span = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  let cur = null, mode = "";
  const push = (kind, row) => { if (!cur || cur.kind !== kind) blocks.push(cur = { kind, rows: [] }); cur.rows.push(row); };
  for (const line of lines) {
    let m;
    if (mode === "call" && /^\s{4,}\S/.test(line) && !TOOL_CALL.test(line) && !/^\s{2,}\|( |$)/.test(line)) { push("call", span("t-arg", line)); continue; }
    if (mode === "you" && /^ {5}/.test(line)) { push("you", esc(line)); continue; }
    mode = "";
    if (!line.trim()) push("gap", "");
    else if (line.startsWith("[loop] ")) push("loop", /Claude finished this turn/.test(line) ? span("t-ask", line)
      : /ended badly|cannot reach|could not|unavailable|\berror\b/i.test(line) ? span("t-err", line) : esc(line));
    else if (line.startsWith("[claude] ")) push("sys", esc(line));
    else if ((m = TOOL_CALL.exec(line))) { mode = "call"; push("call", `${esc(m[1])}<span class="t-mark">&gt;</span> <b class="t-tool">${esc(m[2])}</b>${span("t-arg", m[3])}`); }
    else if ((m = /^(\s{2,}\|)( |$)(.*)$/.exec(line))) {
      const cls = /^error:/i.test(m[3]) ? "t-err" : /^\(from .*\)$|^\.\.\. \d+ more lines?$/.test(m[3]) ? "t-dim" : "";
      push("result", span("t-pipe", m[1]) + m[2] + (cls ? span(cls, m[3]) : esc(m[3])));
    }
    else if (line.startsWith("You: ")) { mode = "you"; push("you", `<b class="t-you">You:</b>${esc(line.slice(4))}`); }
    else if (/^(Traceback \(most recent call last\)|[A-Za-z.]*(Error|Exception)\b\S*:|error:|fatal:|ERROR\b|API Error)/.test(line)) push("prose", span("t-err", line));
    else if (/^#{1,6} /.test(line)) push("prose", span("t-h", line));
    else push("prose", esc(line));
  }
  return blocks.map(b => `<span class="tb tb-${b.kind}">${b.rows.join("\n")}</span>`).join("");
}

// What the worker is doing now, from whether it is alive and the last thing it printed.
function termState(alive, text) {
  text = String(text || "").trimEnd();
  const last = (text.split("\n").pop() || "").trim();
  if (alive) {
    if (/^\[loop\] Claude finished this turn/.test(last)) return ["reply", "Turn finished · reply open"];
    if (/^\[loop\] on hold/.test(last)) return ["wait", "On hold"];
    if (/^\[loop\] cannot reach/.test(last)) return ["wait", "Reconnecting"];
    if (/^\[loop\] Iteration \d+ (finished|ended badly)/.test(last)) return ["wait", "Between rounds"];
    return ["work", "Working"];
  }
  if (!text) return ["", ""];
  const end = (text.match(/^\[loop\] .*$/gm) || []).pop() || "";
  return /Loop stopped: reached/.test(end) ? ["done", "Finished"] : ["stop", "Stopped"];
}
const sayHint = tone => tone === "reply" ? "Claude finished its turn. A message now continues it; otherwise the loop moves on." : "Claude reads this at its next step.";

const isNum = v => typeof v === "number" && isFinite(v) && v >= 0;
const dur = s => { s = Math.round(s); return s < 60 ? s + " s" : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`; };
const usd = n => n > 0 && n < 0.01 ? "<$0.01" : "$" + n.toFixed(2);
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const told = r => isNum(r.stats?.messages) ? r.stats.messages : r.told || 0;
// Per-round figures from the runner's statistics. Anything not reported is left out, never shown as zero.
function roundFigures(r) {
  const s = r.stats || {}, tokens = (isNum(s.input_tokens) ? s.input_tokens : 0) + (isNum(s.output_tokens) ? s.output_tokens : 0), you = told(r);
  return [isNum(s.seconds) && dur(s.seconds), isNum(s.cost_usd) && usd(s.cost_usd), isNum(s.turns) && s.turns && plural(s.turns, "turn"),
    isNum(s.tools) && s.tools && plural(s.tools, "tool call"), you && plural(you, "message") + " from you", tokens && compact(tokens) + " tokens"].filter(Boolean);
}

// Totals for the loop session the terminal is showing, with a row of round durations.
function sessionSummary(rounds, launch) {
  if (!launch?.session) return "";
  const list = rounds.filter(r => r.session === launch.session && r.agent === launch.agent).sort((a, b) => a.number - b.number);
  if (!list.length) return "";
  const ended = list.filter(r => r.state === "Finished" || r.state === "Failed");
  const done = list.filter(r => r.state === "Finished").length, bad = list.filter(r => r.state === "Failed").length;
  const timed = ended.filter(r => isNum(r.stats?.seconds)), costed = ended.filter(r => isNum(r.stats?.cost_usd));
  const you = list.reduce((n, r) => n + told(r), 0), now = list[list.length - 1];
  const partial = (n, of) => n < of ? ` <span class="sub">(${n} of ${of} rounds)</span>` : "";
  const parts = [
    launch.alive && now.open && !now.state && `Round <b>${esc(now.number)}</b> in progress`,
    done && `<b>${done}</b> ${done === 1 ? "round" : "rounds"} finished`,
    bad && `<b class="t-err">${bad}</b> failed`,
    timed.length && `<b>${dur(timed.reduce((n, r) => n + r.stats.seconds, 0))}</b> working${partial(timed.length, ended.length)}`,
    costed.length && `<b>${usd(costed.reduce((n, r) => n + r.stats.cost_usd, 0))}</b> spent${partial(costed.length, ended.length)}`,
    you && `<b>${you}</b> ${you === 1 ? "message" : "messages"} from you`
  ].filter(Boolean);
  if (!parts.length) return "";
  const bars = timed.slice(-40), max = Math.max(...bars.map(r => r.stats.seconds), 1);
  const said = bars.map(r => `round ${r.number}${r.state === "Failed" ? " (failed)" : ""} ${dur(r.stats.seconds)}`).join(", ");
  const chart = bars.length > 1 ? `<span class="term-bars" role="img" aria-label="Round durations: ${esc(said)}">${bars.map(r =>
    `<i class="${r.state === "Failed" ? "bad" : ""}" style="height:${Math.max(3, Math.round(20 * r.stats.seconds / max))}px" title="Round ${esc(r.number)} · ${esc(dur(r.stats.seconds))}${r.state === "Failed" ? " · failed" : ""}"></i>`).join("")}</span>` : "";
  return `<div class="term-stats"><span class="term-label">This loop</span>${parts.map(x => `<span>${x}</span>`).join("")}${chart}</div>`;
}

// Stop asks once, inline, and the question lapses on its own.
function stopButtons(launch) {
  const armed = stopArmed.agent === launch.agent && stopArmed.until > Date.now();
  return (armed ? `<span class="term-confirm" role="status">Stop ${esc(launch.agent)} now?</span>` : "") +
    `<button class="btn small ${armed ? "danger" : "ghost"}" data-loop-stop="${esc(launch.agent)}" data-fk="loop-stop">${armed ? "Yes, stop" : "Stop"}</button>` +
    (armed ? '<button class="btn small ghost" data-loop-stop-cancel data-fk="loop-stop-cancel">Keep running</button>' : "");
}
// Start: one summary line of what will run, Settings, Start. The same bar on the Overview and under the terminal.
function startBar(p) {

  if (!recipeList(p).length) return `<p class="term-hint">Starting loops from this page is off. Run the dashboard with <code>python3 scripts/hades.py --allow-launch</code> to turn it on.</p>` + hint;
  return `<form class="loop-start" data-loop-start aria-label="Start a loop">
      <span class="run-summary">${esc(runSummary(p))}</span>
      <button class="btn small ghost" type="button" data-loop-settings data-fk="loop-settings" aria-haspopup="dialog">Settings</button>
      <button class="btn small" type="submit" data-fk="loop-go">Start loop</button></form>` + hint;
}

function terminalPanel(p, round, launch, { rounds = [], compose = "", idle = "" } = {}) {
  const pinned = pinnedRounds.has(p.id);
  const file = pinned ? null : attachedLogs.get(p.id);
  const choose = window.showOpenFilePicker && !pinned && !file && !launch?.alive ? '<button class="btn small ghost" data-attach-log data-fk="attach-log">Follow a log file</button>' : "";
  if (!file && !launch) return `<section class="loop-console loop-term" aria-labelledby="term-h">
    <header class="term-head"><div class="term-title"><h2 id="term-h">Terminal</h2><span class="term-state" data-tone="idle"><i aria-hidden="true"></i><span>Idle</span></span></div>
    <div class="term-actions">${choose}</div></header>

async function sayToTerminal(form) {

/* ---------- loop settings: one dialog for everything that shapes a run (outside #view, so re-renders leave it alone) ---------- */

// Refresh independently from project updates, including while no model events arrive.
async function refreshTerminal() {
  const panel = document.querySelector("[data-console-key]");
  try {
    if (!panel) return;
    const { consoleKey: key, project, agent, session, file } = panel.dataset;
    let text, clipped;
    if (file) {
      const selected = attachedLogs.get(project);
      if (!selected) return;
      const log = await selected.handle.getFile();
      clipped = log.size > 65536;
      text = await log.slice(Math.max(0, log.size - 65536)).text();
    } else {
      const params = new URLSearchParams({project, agent, session});
      const res = await fetch("/api/terminal?" + params, {cache: "no-store"});
      if (!res.ok) throw Error(res.status === 403 ? "Open Hades on localhost to view this terminal." : "Terminal unavailable.");
      ({text, clipped} = await res.json());
    }
    if (!panel.isConnected) return;
    // Normalize console styling and carriage-return progress lines without interpreting markup.
    text = text.replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, "").replace(/\r\n/g, "\n").replace(/[^\n\r]*\r/g, "");
    const info = clipped ? "Showing the latest 64 KiB" : !text ? "Waiting for terminal output…" : file || panel.dataset.alive === "1" ? "Live output" : "Output from the last run";
    const pre = panel.querySelector("[data-console-text]");
    // A fresh render already drew the cached text; redraw only when the text changed, and never under the reader's selection.
    if (terminalDrawn.el !== pre && terminalView.key === key && terminalView.text === text) terminalDrawn = { el: pre, text };
    const sel = getSelection(), holding = sel && !sel.isCollapsed && pre.contains(sel.anchorNode);
    if ((terminalDrawn.el !== pre || terminalDrawn.text !== text) && !holding) {
      const tail = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 5;
      pre.innerHTML = transcriptHTML(text);
      terminalDrawn = { el: pre, text };
      if (tail) pre.scrollTop = pre.scrollHeight;
      else panel.querySelector("[data-term-latest]").hidden = false;
    }
    panel.querySelector("[data-console-info]").textContent = info;
    terminalView = { key, text: terminalDrawn.el === pre ? terminalDrawn.text : terminalView.text, info };
    if (!file) {
      const [tone, label] = termState(panel.dataset.alive === "1", text), badge = panel.querySelector("[data-term-state]");
      if (panel.dataset.state !== tone || badge.lastElementChild.textContent !== label) {
        panel.dataset.state = tone;
        badge.dataset.tone = tone; badge.hidden = !label; badge.lastElementChild.textContent = label;
        const hint = panel.querySelector("[data-say-hint]");
        if (hint) hint.textContent = sayHint(tone);
      }
    }
  } catch (error) {
    if (panel?.isConnected) panel.querySelector("[data-console-info]").textContent = error.message || "Terminal unavailable.";
  } finally {
    setTimeout(refreshTerminal, document.hidden ? 2000 : 500);
  }
}

// A closing note ends with labelled lines after "Handoff:": Results, Ruled out, Leads, Decision needed, Next. Each holds text or bullet lines, or "none".
const HANDOFF_LABEL = /^\s*(?:[-*]\s+)?(?:\*\*)?(Results|Ruled out|Leads|Decision needed|Next)(?:\*\*)?\s*:(?:\*\*)?\s*(.*)$/i;
function parseHandoff(text) {
  const lead = [], parts = [];
  for (const line of String(text || "").replace(/\r/g, "").split("\n")) {
    const m = HANDOFF_LABEL.exec(line);
    if (m) { parts.push({ label: cap(m[1].toLowerCase()), items: m[2].trim() ? [m[2].trim()] : [] }); continue; }
    if (!parts.length) { lead.push(line); continue; }
    const item = line.replace(/^\s*(?:[-*]|\d+[.)])\s+/, "").trim();
    if (item) parts[parts.length - 1].items.push(item);
  }
  const none = items => !items.length || (items.length === 1 && /^(none|n\/a|nothing)\.?$/i.test(items[0]));
  return { lead: lead.join("\n").trim(), parts: parts.map(x => ({ ...x, items: none(x.items) ? [] : x.items })) };
}
// The line a round is best known by: its first result, else the first line of its handoff.
function handoffHeadline(text) {
  const { lead, parts } = parseHandoff(text), result = parts.find(x => x.label === "Results")?.items[0];
  return (result || lead.split("\n")[0] || "").replace(/\*\*/g, "").trim().slice(0, 160);
}
function handoffHTML(text) {
  const { lead, parts } = parseHandoff(text);
  if (!parts.length) return `<div class="md">${md(text)}</div>`;
  return `${lead ? `<div class="md">${md(lead)}</div>` : ""}<dl class="handoff">${parts.map(x =>
    `<div><dt>${esc(x.label)}</dt><dd>${!x.items.length ? '<span class="sub">None</span>' : x.items.length === 1 ? mdInline(x.items[0]) : `<ul>${x.items.map(i => `<li>${mdInline(i)}</li>`).join("")}</ul>`}</dd></div>`).join("")}</dl>`;
}
function publicLoopUpdate(e) {
  const data = e.data || {};
  const refs = [data.evidence, ...(Array.isArray(e.evidence) ? e.evidence.map(ref => ref.ref) : [])]
    .flat().filter(ref => typeof ref === "string" && ref.trim());
  let title, label, detail;
  if (e.type === "activity") {
    title = e.text; label = "Progress update";
  } else if (e.type === "research" && e.origin === "handoff") {
    return null;  // recorded from the round's own handoff, which the round already shows as Results / Ruled out
  } else if (e.type === "research" || e.type === "question") {
    title = e.text || e.id; label = e.type === "research" ? "Research note" : "Assumption";
    detail = e.body;
  } else if (e.type === "topic" || e.type === "item") {
    title = e.key; label = e.type === "topic" ? "Library page updated" : "Project entry updated";
    detail = e.text;
  } else return null;
  if (!title) return null;
  return { title, label, detail, refs, reason: data.reason, outcome: data.outcome, ts: e.ts,
    // The runner's own delivery receipt is a log line, not the round's headline.
    focus: ["activity", "research", "question"].includes(e.type) &&
      !(e.type === "activity" && /^A message from the person was delivered/.test(e.text || "")) };
}

function readLoop(events) {
  const rounds = [], sessions = new Map(), agents = new Map();
  let lastStop = null;
  events.forEach((e, index) => {
    if (e.type === "activity" && e.source === "you" && e.harness === "terminal" && !e.agent && e.key) {
      // The server's record of a message the person sent to a worker: count it on that worker's round open at the time.
      const r = [...rounds].reverse().find(r => r.agent === e.key && Date.parse(r.ts) <= Date.parse(e.ts) && (r.open || !r.state));
      if (r) r.told = (r.told || 0) + 1;
      return;
    }
    if (!e.agent) return;
    const note = e.type === "item" && e.section === "round-notes", session = e.data?.loop_session || "", id = JSON.stringify([e.agent, session]);
    const activity = e.type === "activity";
    const marker = note ? /^Round (\d+) ·/.exec(e.key) : activity && /^Iteration (\d+) (started$|finished \(exit 0\)$|ended badly\b)/.exec(e.text);
    const stop = activity && (e.text || "").startsWith("Loop stopped:");
    let round = sessions.get(id);
    if (!session && !marker && !stop && !note) {
      // Harness activity can be attached only when this name identifies one open round.
      const open = agents.get(e.agent);
      if (open?.size !== 1) return;
      round = open.values().next().value;
    }
    if (stop) lastStop = e;
    if (marker && (marker[2] === "started" || !round || round.number !== marker[1])) {
      const open = agents.get(e.agent) || new Set();
      if (round) { round.open = false; open.delete(round); }
      round = { key: index, number: marker[1], agent: e.agent, session, harness: e.harness, ts: e.ts, state: "", open: true, lines: [], updates: [], frame: marker[2] === "started" ? e.data?.frame || "" : "" };
      sessions.set(id, round);
      open.add(round);
      agents.set(e.agent, open);
      rounds.push(round);
    }
    if (!round || (note && !marker) || (!marker && !stop && round.state)) return;
    if (marker && marker[2] !== "started" && e.data?.stats && typeof e.data.stats === "object") round.stats = e.data.stats;
    const update = !note && !marker && !stop ? publicLoopUpdate(e) : null;
    if (!note && !marker && !stop && !update) return;
    if (update) {
      round.updates.push(update);
      if (update.focus) round.focus = update;
    }
    if (note) {
      round.hasOutput = true;
      const output = e.body || e.text || "";
      const marker = [...output.matchAll(/^(?:\*\*)?Handoff:(?:\*\*)?\s*/gim)].pop();
      round.handoff = marker ? output.slice(marker.index + marker[0].length).trim() : output;
      round.hasHandoff = !!marker;
      if (/^API Error:/i.test(e.body || "")) round.apiError = true;
    }
    if (marker?.[2]?.startsWith("finished")) round.state = "Finished";
    if (marker?.[2]?.startsWith("ended badly")) round.state = "Failed";
    if (stop) round.state ||= round.hasOutput ? "Output saved" : "Loop stopped";
    if (round.state) { round.open = false; agents.get(round.agent)?.delete(round); }
    round.lines.push({ ts: e.ts, text: note ? "Saved round output\n" + (e.body || e.text || "") : update && !activity ? update.label + " · " + update.title : e.text });
    round.lastEvent = index;
    if (stop) sessions.delete(id);
  });
